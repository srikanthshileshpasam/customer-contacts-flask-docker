{% extends "base.html" %}
{% block content %}
<h2>{{ action }} Contact</h2>
<form method="post">
    <label>Name * <input type="text" name="name" value="{{ contact.name }}" required></label>
    <label>Email * <input type="email" name="email" value="{{ contact.email }}" required></label>
    <label>Phone <input type="text" name="phone" value="{{ contact.phone or '' }}"></label>
    <label>Company <input type="text" name="company" value="{{ contact.company or '' }}"></label>
    <br><br>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
