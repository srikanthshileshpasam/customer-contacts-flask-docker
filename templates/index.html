{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('create') }}" class="btn btn-primary">+ New Contact</a>
<table>
    <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for c in contacts %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.phone or '' }}</td>
            <td>{{ c.company or '' }}</td>
            <td>
                <a href="{{ url_for('edit', id=c.id) }}" class="btn btn-secondary">Edit</a>
                <form action="{{ url_for('delete', id=c.id) }}" method="post" style="display:inline" onsubmit="return confirm('Delete this contact?')">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="6">No contacts yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
