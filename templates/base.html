<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Contacts (Flask)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; }
        .btn { display: inline-block; padding: 8px 14px; margin: 2px; text-decoration: none; border-radius: 4px; color: white; border: none; cursor: pointer; }
        .btn-primary { background: #2563eb; }
        .btn-danger { background: #dc2626; }
        .btn-secondary { background: #6b7280; }
        .flash { padding: 12px; margin-bottom: 16px; border-radius: 4px; }
        .flash.success { background: #d1fae5; color: #065f46; }
        .flash.error { background: #fee2e2; color: #991b1b; }
        form label { display: block; margin-top: 12px; }
        form input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Customer Contacts <small style="font-size:0.6em;color:#666">(Flask + PostgreSQL)</small></h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
