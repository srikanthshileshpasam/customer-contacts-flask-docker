services:
  web:
    build: .
    container_name: contacts-web-docker
    ports:
      - "5001:5000"
    environment:
      DB_HOST: host.docker.internal
      DB_NAME: contacts
      DB_USER: appuser
      DB_PASS: mypassword123
      DB_PORT: "5432"
      FLASK_SECRET_KEY: change-this-to-a-long-random-string-in-production
      PORT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped