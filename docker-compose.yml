services:
  db:
    image: postgres:16
    container_name: contacts-db-docker
    environment:
      POSTGRES_DB: contacts
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: mypassword123
    ports:
      - "5433:5432"          # host port 5433 so it does not clash with any host PostgreSQL
    volumes:
      - contacts_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # creates the table on first start
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d contacts"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: contacts-web-docker
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db                 # ← Docker service name (internal network)
      DB_NAME: contacts
      DB_USER: appuser
      DB_PASS: mypassword123
      DB_PORT: "5432"
      FLASK_SECRET_KEY: change-this-to-a-long-random-string-in-production
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  contacts_pgdata:                # named volume keeps your data even if you remove the container